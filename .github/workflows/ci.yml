name: Rust and source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --package yield-parser --package yield-indexer --package yield-stream --package blockzilla-decoder -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings
      - run: cargo build --locked -p yield-indexer
      - run: python3 scripts/smoke-server.py --binary target/debug/yield-indexer
      - run: python3 scripts/smoke.py --binary target/debug/yield-indexer
      - run: python3 scripts/check-repository.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 vendor/blockzilla/snapshot.py --verify
