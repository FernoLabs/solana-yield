[package]
name = "blockzilla-primitives"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/FernoLabs/blockzilla"
publish = ["crates-io"]
autobins = false
description = "Shared key, string-table and LEB128 framing primitives"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
solana-pubkey = "4.2.1"
wincode = { version = "=0.6.1", features = ["derive"] }

[lints.rust]
unexpected_cfgs = "deny"
