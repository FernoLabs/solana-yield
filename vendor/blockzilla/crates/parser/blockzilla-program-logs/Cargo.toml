[package]
name = "blockzilla-program-logs"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/FernoLabs/blockzilla"
publish = ["crates-io"]
autobins = false
description = "Known-program log decoding for Solana program output"

[features]
default = ["known-program-logs"]
known-program-logs = [
    "known-drift",
    "known-okx-router",
    "known-phoenix-perps",
    "known-phoenix-v1",
    "known-raydium-amm",
    "known-static-programs",
]
known-drift = []
known-okx-router = []
known-phoenix-perps = []
known-phoenix-v1 = []
known-raydium-amm = []
known-static-programs = []

[dependencies]
blockzilla-primitives = { path = "../../blockzilla-primitives", version = "0.2.0" }
data-encoding = "2.11.1"
serde = { version = "1.0.229", features = ["derive"] }
solana-pubkey = "4.2.1"
wincode = { version = "=0.6.1", features = ["derive"] }

[lints.rust]
unexpected_cfgs = "deny"
