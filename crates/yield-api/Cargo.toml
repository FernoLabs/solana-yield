[package]
name = "yield-indexer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent yield observations from Solana state and explicit API sources"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.23.1"
bs58 = "0.5.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
futures = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal"] }
tower = { version = "0.5.3", features = ["limit"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
