[package]
name = "blockzilla-decoder"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Bounded native Blockzilla compact block projections"
license = "MIT"

[features]
test-fixtures = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blockzilla-bank-stream-v2 = { path = "../../vendor/blockzilla/crates/blockzilla-bank-stream-v2" }
blockzilla-archive-v2 = { path = "../../vendor/blockzilla/crates/compact-v2/blockzilla-archive-v2", default-features = false, features = ["known-program-logs", "portable-registry"] }
blockzilla-compact = { path = "../../vendor/blockzilla/crates/compact-v2/blockzilla-compact", default-features = false, features = ["known-program-logs", "portable-registry"] }
blockzilla-primitives = { path = "../../vendor/blockzilla/crates/blockzilla-primitives", default-features = false }
bs58 = "0.5.1"
five8 = "1.0.0"
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
solana-message = "4.4.1"
solana-pubkey = { version = "4.2.1", features = ["curve25519"] }
solana-transaction = { version = "4.1.6", features = ["serde", "wincode"] }
solana-transaction-status-client-types = { version = "=4.2.2", features = ["agave-unstable-api"] }
wincode-blockzilla = { package = "wincode", version = "=0.6.1" }
